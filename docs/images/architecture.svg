<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">AWS Multi-AZ Production VPC Enterprise Networking Blueprint</text>
  <rect x="930" y="40" width="95" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="943" y="58" fill="#047857" font-size="11" font-weight="700">PRODUCTION</text>
  <rect x="1035" y="40" width="105" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1047" y="58" fill="#1d4ed8" font-size="11" font-weight="700">TERRAFORM IaC</text>

  <!-- COLUMN 1: Edge & Public Subnets -->
  <rect x="40" y="110" width="340" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="340" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. EDGE &amp; PUBLIC SUBNETS (INGRESS)</text>

  <rect x="60" y="165" width="300" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="192" fill="#0f172a" font-size="14" font-weight="600">Internet Gateway (IGW)</text>
  <text x="75" y="214" fill="#64748b" font-size="11">Route 53 DNS • AWS WAF v2 • Shield DDoS</text>

  <rect x="60" y="245" width="300" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="272" fill="#0f172a" font-size="14" font-weight="600">Application Load Balancers (ALB)</text>
  <text x="75" y="294" fill="#64748b" font-size="11">Dual-AZ Public Ingress • TLS 1.3 Termination</text>

  <rect x="60" y="325" width="300" height="75" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="352" fill="#1d4ed8" font-size="13" font-weight="600">Managed NAT Gateways</text>
  <text x="75" y="372" fill="#475569" font-size="11">• NAT-GW-AZ-a: Elastic IP attached</text>
  <text x="75" y="390" fill="#475569" font-size="11">• NAT-GW-AZ-b: High Availability Egress</text>

  <rect x="60" y="415" width="300" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="442" fill="#0f172a" font-size="14" font-weight="600">Public Route Tables</text>
  <text x="75" y="464" fill="#64748b" font-size="11">0.0.0.0/0 =&gt; Internet Gateway destination</text>

  <rect x="60" y="495" width="300" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="522" fill="#0f172a" font-size="13" font-weight="600">Network ACLs (Subnet Tier 1)</text>
  <text x="75" y="544" fill="#64748b" font-size="11">Stateless perimeter filtering (Inbound 80/443)</text>
  <text x="75" y="564" fill="#64748b" font-size="11">Strict ephemeral return port restrictions</text>

  <!-- COLUMN 2: Private Compute Subnets -->
  <rect x="410" y="110" width="370" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="410" y="110" width="370" height="40" rx="8" fill="#f1f5f9"/>
  <text x="430" y="136" fill="#d97706" font-size="13" font-weight="700">2. PRIVATE WORKLOAD SUBNETS (MULTI-AZ)</text>

  <rect x="430" y="165" width="330" height="135" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="445" y="190" fill="#1d4ed8" font-size="13" font-weight="600">Subnet AZ-a (10.0.1.0/24)</text>

  <rect x="445" y="205" width="140" height="55" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="455" y="228" fill="#0f172a" font-size="12" font-weight="600">EKS Node AZ-a</text>
  <text x="455" y="248" fill="#64748b" font-size="10">Pod Microservices</text>

  <rect x="605" y="205" width="140" height="55" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="615" y="228" fill="#0f172a" font-size="12" font-weight="600">Internal ALB / VIP</text>
  <text x="615" y="248" fill="#64748b" font-size="10">Private Endpoints</text>

  <text x="445" y="285" fill="#475569" font-size="11">Default Route: 0.0.0.0/0 =&gt; nat-gateway-az-a</text>

  <rect x="430" y="315" width="330" height="135" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="445" y="340" fill="#1d4ed8" font-size="13" font-weight="600">Subnet AZ-b (10.0.2.0/24)</text>

  <rect x="445" y="355" width="140" height="55" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="455" y="378" fill="#0f172a" font-size="12" font-weight="600">EKS Node AZ-b</text>
  <text x="455" y="398" fill="#64748b" font-size="10">Pod Replicas</text>

  <rect x="605" y="355" width="140" height="55" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="615" y="378" fill="#0f172a" font-size="12" font-weight="600">Auto Scaling Group</text>
  <text x="615" y="398" fill="#64748b" font-size="10">Target Tracking Policy</text>

  <text x="445" y="435" fill="#475569" font-size="11">Default Route: 0.0.0.0/0 =&gt; nat-gateway-az-b</text>

  <rect x="430" y="465" width="330" height="115" rx="6" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1"/>
  <text x="445" y="492" fill="#4338ca" font-size="13" font-weight="600">Security Groups &amp; Least Privilege</text>
  <text x="445" y="516" fill="#475569" font-size="11">• Ingress restricted to ALB Security Group ID only</text>
  <text x="445" y="538" fill="#475569" font-size="11">• Strict egress policy with VPC internal CIDR bounds</text>
  <text x="445" y="560" fill="#475569" font-size="11">• Zero direct external internet reachability</text>

  <!-- COLUMN 3: Endpoints & Storage Isolation -->
  <rect x="810" y="110" width="350" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="810" y="110" width="350" height="40" rx="8" fill="#f1f5f9"/>
  <text x="830" y="136" fill="#7c3aed" font-size="13" font-weight="700">3. VPC ENDPOINTS &amp; DATA TIER</text>

  <rect x="830" y="165" width="310" height="75" rx="6" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1"/>
  <text x="845" y="192" fill="#065f46" font-size="13" font-weight="600">S3 Gateway Endpoint</text>
  <text x="845" y="214" fill="#475569" font-size="11">Direct internal routing table injection</text>
  <text x="845" y="232" fill="#059669" font-size="10" font-weight="600">$0 NAT Transfer Cost • High-Throughput S3</text>

  <rect x="830" y="255" width="310" height="85" rx="6" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
  <text x="845" y="282" fill="#0369a1" font-size="13" font-weight="600">AWS PrivateLink Interface Endpoints</text>
  <text x="845" y="304" fill="#475569" font-size="11">• ECR API &amp; DKR PrivateLink Endpoints</text>
  <text x="845" y="324" fill="#475569" font-size="11">• AWS KMS, CloudWatch Logs, SSM Session Mgr</text>

  <rect x="830" y="355" width="310" height="105" rx="6" fill="#f8fafc" stroke="#fed7aa" stroke-width="1"/>
  <text x="845" y="382" fill="#c2410c" font-size="13" font-weight="600">Isolated Database Subnet (Multi-AZ)</text>
  <text x="845" y="406" fill="#475569" font-size="11">• RDS PostgreSQL / Aurora Multi-AZ Cluster</text>
  <text x="845" y="426" fill="#475569" font-size="11">• Strict DB Subnet Group (No Internet Route)</text>
  <text x="845" y="446" fill="#475569" font-size="11">• AES-256 Storage Encryption with KMS CMK</text>

  <rect x="830" y="475" width="310" height="105" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="845" y="502" fill="#0f172a" font-size="13" font-weight="600">VPC Flow Logs &amp; Telemetry</text>
  <text x="845" y="526" fill="#475569" font-size="11">• 1-minute aggregation interval to CloudWatch</text>
  <text x="845" y="546" fill="#475569" font-size="11">• GuardDuty threat &amp; anomaly detection</text>
  <text x="845" y="566" fill="#475569" font-size="11">• Parquet archive to secure audit S3 bucket</text>

  <!-- Connectors -->
  <line x1="380" y1="355" x2="410" y2="355" stroke="#0284c7" stroke-width="2" stroke-dasharray="4"/>
  <line x1="780" y1="355" x2="810" y2="355" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4"/>
</svg>